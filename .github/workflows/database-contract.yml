name: Database contract

on:
  push:
    branches:
      - feat/territory-installer
  pull_request:

jobs:
  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript contracts
        run: npm test

      - name: Start local Supabase
        run: npm run db:start

      - name: Rebuild database from migrations
        run: npm run db:reset

      - name: Run pgTAP database contracts
        run: npm run test:db

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop -- --no-backup
