name: Database contract

on:
  push:
    branches:
      - feat/territory-installer
  pull_request:

jobs:
  legacy-history-characterization:
    name: legacy-history-characterization (known failure in 020)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # O legado 001-090 registra a evolução da instância original e não é um
    # caminho reproduzível de instalação: 020 falha ao recriar quadras_geo.
    # Mantemos o job como evidência até existir um bootstrap de comparação,
    # sem tornar esse defeito histórico um bloqueio para a baseline nova.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript contracts
        run: npm test

      - name: Start local Supabase
        run: npm run db:start

      - name: Rebuild database from migrations
        run: npm run db:reset

      - name: Run pgTAP database contracts
        run: npm run test:db

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop -- --no-backup

  baseline-smoke:
    name: baseline-smoke (required)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated baseline project
        run: |
          mkdir -p .baseline-smoke/supabase/migrations
          cp supabase/config.toml .baseline-smoke/supabase/config.toml
          cp supabase/baseline/[0-9][0-9][0-9]_*.sql .baseline-smoke/supabase/migrations/

      - name: Start Supabase and apply baseline
        working-directory: .baseline-smoke
        run: npx --yes supabase@2.110.0 start

      - name: Reapply baseline from an empty database
        working-directory: .baseline-smoke
        run: npx --yes supabase@2.110.0 db reset

      - name: Stop baseline Supabase
        if: always()
        working-directory: .baseline-smoke
        run: npx --yes supabase@2.110.0 stop --no-backup
